name: Bug report
description: Report a problem with Meeting Vision Studio
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as you can.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to ...
        2. Add a camera / upload a clip
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser + OS + Node version
      placeholder: 'Chrome 131 on Windows 11, Node 20.18'
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / logs
      description: Console errors or screenshots help a lot.
