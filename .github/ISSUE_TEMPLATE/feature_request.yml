name: Feature request
description: Suggest an idea or enhancement
title: 'feat: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make the studio better? We'd love to hear it.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve, or what opportunity does it unlock?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection / models
        - UI / dashboard
        - Scenarios / humor layer
        - Export / reporting
        - Performance
        - Other
